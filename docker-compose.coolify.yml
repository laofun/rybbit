# Rybbit fork - Coolify Docker Compose Build Pack deployment.
#
# DOMAIN CONFIGURATION (single domain, path-based routing per Rybbit official):
#
# 1. Set the Domain field in Coolify UI ONLY for the `client` service:
#       https://<your-domain>:3002
#    Leave the Domain field EMPTY for `backend` (manual labels handle it).
#
# 2. EDIT the hardcoded `RYBBIT_DOMAIN` value in the backend labels below
#    to match your domain. Coolify does NOT substitute ${VAR} in compose
#    labels, so the domain must be hardcoded here. Replace
#    `analytics.lab.destini.vn` with your actual domain.
#
# 3. Backend serves /api/* on the SAME domain as client. No StripPrefix
#    (Rybbit's Fastify routes are registered with /api prefix). Cookies
#    work cross-route since same origin. Single Let's Encrypt cert covers
#    both client (/) and backend (/api).
services:
  rybbit-clickhouse:
    image: clickhouse/clickhouse-server:25.4.2
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    configs:
      - source: clickhouse_network
        target: /etc/clickhouse-server/config.d/network.xml
      - source: clickhouse_json
        target: /etc/clickhouse-server/config.d/enable_json.xml
      - source: clickhouse_logging
        target: /etc/clickhouse-server/config.d/logging_rules.xml
      - source: clickhouse_user_logging
        target: /etc/clickhouse-server/config.d/user_logging.xml
    environment:
      - CLICKHOUSE_DB=${CLICKHOUSE_DB:-analytics}
      - CLICKHOUSE_USER=${CLICKHOUSE_USER:-default}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:-frog}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  rybbit-postgres:
    image: postgres:17.4
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-frog}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-frog}
      - POSTGRES_DB=${POSTGRES_DB:-analytics}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: ./server/Dockerfile
    environment:
      - NODE_ENV=production
      - CLICKHOUSE_HOST=http://rybbit-clickhouse:8123
      - CLICKHOUSE_DB=${CLICKHOUSE_DB:-analytics}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:-frog}
      - POSTGRES_HOST=rybbit-postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-analytics}
      - POSTGRES_USER=${POSTGRES_USER:-frog}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-frog}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - BASE_URL=${BASE_URL}
      - DOMAIN_NAME=${DOMAIN_NAME}
      - DISABLE_SIGNUP=${DISABLE_SIGNUP:-false}
      - DISABLE_TELEMETRY=${DISABLE_TELEMETRY:-true}
      - MAPBOX_TOKEN=${MAPBOX_TOKEN:-}
    depends_on:
      rybbit-clickhouse:
        condition: service_healthy
      rybbit-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3001/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    labels:
      # Manual Traefik labels (HARDCODED domain - edit if you fork).
      # Coolify does not substitute ${VAR} in compose labels, so we cannot
      # use ${DOMAIN_NAME} here. Set Domain field EMPTY in Coolify UI for
      # this service so Coolify does not auto-gen conflicting labels.
      - traefik.enable=true
      - traefik.docker.network=coolify
      - traefik.http.routers.rybbit-backend.entrypoints=https
      - traefik.http.routers.rybbit-backend.tls=true
      - traefik.http.routers.rybbit-backend.tls.certresolver=letsencrypt
      - "traefik.http.routers.rybbit-backend.rule=Host(`analytics.lab.destini.vn`) && (Path(`/api`) || PathPrefix(`/api/`))"
      - traefik.http.routers.rybbit-backend.priority=100
      - traefik.http.services.rybbit-backend.loadbalancer.server.port=3001
      - traefik.http.middlewares.rybbit-fwh.headers.customrequestheaders.X-Forwarded-Proto=https
      - traefik.http.middlewares.rybbit-fwh.headers.customrequestheaders.X-Forwarded-Host=analytics.lab.destini.vn
      - traefik.http.routers.rybbit-backend.middlewares=rybbit-fwh
      # HTTP -> HTTPS redirect for /api
      - traefik.http.routers.rybbit-backend-http.entrypoints=http
      - "traefik.http.routers.rybbit-backend-http.rule=Host(`analytics.lab.destini.vn`) && (Path(`/api`) || PathPrefix(`/api/`))"
      - traefik.http.middlewares.rybbit-redirect.redirectscheme.scheme=https
      - traefik.http.routers.rybbit-backend-http.middlewares=rybbit-redirect

  client:
    build:
      context: .
      dockerfile: ./client/Dockerfile
      args:
        # Single-domain pattern: client calls backend on the same origin
        # via /api path (Rybbit Fastify routes preserve the /api prefix).
        NEXT_PUBLIC_BACKEND_URL: ${BASE_URL}
        NEXT_PUBLIC_DISABLE_SIGNUP: ${DISABLE_SIGNUP:-false}
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_BACKEND_URL=${BASE_URL}
      - NEXT_PUBLIC_DISABLE_SIGNUP=${DISABLE_SIGNUP:-false}
      - DOMAIN_NAME=${DOMAIN_NAME}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3002"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

volumes:
  clickhouse-data:
  postgres-data:

configs:
  clickhouse_network:
    content: |
      <clickhouse>
          <listen_host>0.0.0.0</listen_host>
      </clickhouse>
  clickhouse_json:
    content: |
      <clickhouse>
          <settings>
              <enable_json_type>1</enable_json_type>
          </settings>
      </clickhouse>
  clickhouse_logging:
    content: |
      <clickhouse>
        <logger>
            <level>warning</level>
            <console>true</console>
        </logger>
        <query_thread_log remove="remove"/>
        <query_log remove="remove"/>
        <text_log remove="remove"/>
        <trace_log remove="remove"/>
        <metric_log remove="remove"/>
        <asynchronous_metric_log remove="remove"/>
        <session_log remove="remove"/>
        <part_log remove="remove"/>
        <latency_log remove="remove"/>
        <processors_profile_log remove="remove"/>
      </clickhouse>
  clickhouse_user_logging:
    content: |
      <clickhouse>
        <profiles>
          <default>
            <log_queries>0</log_queries>
            <log_query_threads>0</log_query_threads>
            <log_processors_profiles>0</log_processors_profiles>
          </default>
        </profiles>
      </clickhouse>
